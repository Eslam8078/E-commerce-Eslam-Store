<aside class="admin-sidebar">
  <div class="sidebar-logo">
    <h2>Eslam Store</h2>
    <span>Admin Panel</span>
  </div>

  <nav class="sidebar-nav">
    <a
      routerLink="/admin/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <span class="nav-icon">⌂</span>
      <span class="nav-text">Dashboard</span>
    </a>

    <a routerLink="/admin/products" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">▣</span>
      <span class="nav-text">Products</span>
    </a>

    <a routerLink="/admin/categories" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">▤</span>
      <span class="nav-text">Categories</span>
    </a>

    <a routerLink="/admin/subcategories" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">≡</span>
      <span class="nav-text">Subcategories</span>
    </a>

    <a routerLink="/admin/orders" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span class="nav-text">Orders</span>
    </a>

    <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">♙</span>
      <span class="nav-text">Users</span>
    </a>

    <a routerLink="/admin/testimonials" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">✦</span>
      <span class="nav-text">Testimonials</span>
    </a>

    <a routerLink="/admin/reports" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">▥</span>
      <span class="nav-text">Reports</span>
    </a>

    <a routerLink="/admin/faqs" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">?</span>
      <span class="nav-text">FAQs</span>
    </a>

    <a routerLink="/admin/notifications" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🔔</span>
      <span class="nav-text">Notifications</span>
      @if (unreadCount > 0) {
        <span class="nav-badge">{{ unreadCount }}</span>
      }
    </a>

    <a routerLink="/admin/delivery-fees" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">↝</span>
      <span class="nav-text">Delivery Fees</span>
    </a>

    <a routerLink="/admin/backups" routerLinkActive="active" class="nav-item">
      <span class="nav-icon"><i class="bi bi-database"></i></span>
      <span class="nav-text">Backups</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <button type="button" class="logout-btn" (click)="logout()">
      <span class="nav-icon">↪</span>
      <span class="nav-text">Logout</span>
    </button>
  </div>
</aside>
