<section class="panel">
  <h3>Top Products (selected range)</h3>
  @if (products.length === 0) {
    <p class="hint">No data for this range.</p>
  } @else {
    <table class="table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Qty Sold</th>
          <th>Revenue</th>
        </tr>
      </thead>
      <tbody>
        @for (p of products; track p.productId) {
          <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.totalQuantity }}</td>
            <td>{{ p.totalSales | number }} EGP</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
