<div class="page dashboard-page">
  <div class="page-header">
    <div>
      <h2>Dashboard</h2>
      <p>Overview of store performance</p>
    </div>
    <div class="date-filters">
      <input type="date" [(ngModel)]="fromDate" />
      <span>to</span>
      <input type="date" [(ngModel)]="toDate" />
      <button type="button" (click)="applyDateFilter()">Apply</button>
    </div>
  </div>

  @if (errorMessage) {
    <div class="alert">{{ errorMessage }}</div>
  }

  <app-list-notifications
    [notifications]="newOrderNotifications"
    [loading]="isLoading"
    (refresh)="loadNewOrderNotifications()"
    (notificationSelected)="openOrderNotification($event)"
  />

  <app-dashboard-stats [revenue]="revenue" />

  <div class="two-col">
    <app-list-top-products [products]="topProducts" />
    <app-list-best-sellers [products]="topSales" [staticURL]="staticURL" />
  </div>

  <app-list-new-arrivals [products]="newArrivals" [staticURL]="staticURL" />
</div>
